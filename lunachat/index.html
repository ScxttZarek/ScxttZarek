object-fit:cover}.msgvideo{display:block;width:min(100%,460px);max-height:520px;border-radius:14px;background:#05070b;object-fit:contain}.audio{width:min(100%,330px)}.actions{opacity:0;display:flex}.row:hover .actions{opacity:1}.actions button{border:0;background:none;color:#8790a2;cursor:pointer;padding:5px}.composer{position:sticky;bottom:0;z-index:10;flex:0 0 auto;width:100%;border-top:1px solid var(--line);padding:9px 12px max(11px,env(safe-area-inset-bottom));background:#090b12f7;backdrop-filter:blur(14px)}.pending{max-width:900px;margin:0 auto 7px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#141925;font-size:12px;display:flex;gap:8px;align-items:center}.pending span{flex:1;overflow:hidden;text-overflow:ellipsis}.compose{max-width:900px;margin:auto;display:flex;align-items:flex-end;gap:7px}.box{flex:1;border:1px solid #2b3347;background:linear-gradient(180deg,#161c29,#121722);border-radius:18px;display:flex;align-items:flex-end;box-shadow:0 8px 30px #0003;transition:.16s}.box:focus-within{border-color:#7769d6;box-shadow:0 0 0 4px #8877ff12,0 8px 30px #0003}.box textarea{flex:1;resize:none;max-height:130px;min-height:46px;padding:13px;border:0;outline:0;background:transparent;color:#fff}.send{width:48px;height:48px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--blue));color:#fff;cursor:pointer;box-shadow:0 10px 26px #5f7fe944;transition:.16s}.send:hover{transform:translateY(-1px);filter:brightness(1.08)}.send:active{transform:scale(.97)}.file{display:none}.recording{color:#ff7788!important;background:#351720!important}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;background:#171c28;border:1px solid #2b3346;padding:10px 14px;border-radius:12px;transition:.2s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}.modalBg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:60}.modal{width:min(100%,420px);background:#1 .sideActions{display:flex;align-items:center;gap:3px}.installHint{display:none}.installBtn{color:#c9c2ff!important}.installBtn:not([hidden]){display:inline-grid;place-items:center}

<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm";
const URL="https://sqglmzltsvqtfzpnvrtc.supabase.co",KEY="sb_publishable_BfuQjp6lm5pWnxVUuU59cg_5q7Y8nmN",BUCKET="chat-media";
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=s=>document.querySelector(s),app=$("#app"),toastEl=$("#toast");
let S={me:null,rooms:[],room:null,members:[],messages:[],reads:[],presence:[],ch:[],pending:null,rec:null,stream:null,busy:false};
const esc=(x="")=>String(x).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const initials=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
const time=d=>new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(new Date(d));
const nearBottom=(el,px=150)=>!el||el.scrollHeight-el.scrollTop-el.clientHeight<px;
function toBottom(el=$("#msgs"),smooth=false){if(!el)return;requestAnimationFrame(()=>requestAnimationFrame(()=>el.scrollTo({top:el.scrollHeight,behavior:smooth?"smooth":"auto"})))}
let deferredInstallPrompt=null;
function refreshInstallButton(){const standalone=matchMedia("(display-mode: standalone)").matches;[$("#install"),$("#installLogin")].filter(Boolean).forEach(b=>b.hidden=standalone)}
async function installApp(){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt=null;
      refreshInstallButton();
      return;
    }
    const ua=navigator.userAgent.toLowerCase();
    if(ua.includes("android")) return installHelp("Android: toque em ⋮ no Chrome e escolha “Instalar app” ou “Adicionar à tela inicial”.");
    if(ua.includes("edg/")) return installHelp("Microsoft Edge: clique em ⋯ → Aplicativos → Instalar LunaChat.");
    if(ua.includes("chrome")) return installHelp("Google Chrome: clique no ícone de instalar na barra de endereço ou em ⋮ → Transmitir, salvar e compartilhar → Instalar página como app.");
    return installHelp("Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.");
  }
  function installHelp(message){
    const x=document.createElement("div");
    x.className="modalBg";
    x.innerHTML=`<div class="modal"><h3>Instalar LunaChat</h3><p style="color:var(--muted);line-height:1.55;margin:6px 0 4px">${esc(message)}</p><p style="color:#7f899e;font-size:12px;line-height:1.45">Depois de instalado, ele abre em uma janela própria, como aplicativo.</p><div class="modalBtns"><button id="okInstall">Entendi</button></div></div>`;
    document.body.appendChild(x);
    x.querySelector("#okInstall").onclick=()=>x.remove();
  }
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;refreshInstallButton()});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;refreshInstallButton();toast("LunaChat instalado ✨")});
function toast(t){toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(toastEl.t);toastEl.t=setTimeout(()=>toastEl.classList.remove("on"),2500)}
function login(msg=""){app.innerHTML=`<main class="login"><section class="card"><div class="brand"><div class="logo">☾</div><div><h1>LunaChat</h1><p>Seu espaço privado.</p></div></div><h2>Entrar na sua conversa</h2><p>Digite seu código pessoal. Você verá somente as conversas liberadas para ele.</p><form id="f"><div class="field">🔒<input name="code" type="password" autocomplete="current-password" placeholder="LUNA-••••-••••-••••" required><button type="button" id="eye">👁</button></div><div class="err" id="err">${esc(msg)}</div><button class="primary" id="go">Entrar no LunaChat</button></form><div class="note">🔒 Ambiente fechado · acesso somente por código</div><button type="button" class="primary installLogin" id="installLogin" hidden>⬇ Instalar aplicativo</button></section></main>`;$("#eye").onclick=()=>{const i=$("#f").code;i.type=i.type==="password"?"text":"password"};$("#f").onsubmit=doLogin;const il=$("#installLogin");if(il)il.onclick=installApp;refreshInstallButton()}
async function doLogin(e){e.preventDefault();if(S.busy)return;const code=e.currentTarget.code.value.trim().toUpperCase(),go=$("#go"),er=$("#err");if(code.length<12)return;S.busy=true;go.disabled=true;go.textContent="Entrando…";er.textContent="";try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code})}),j=await r.json();if(!r.ok||!j.access_token)throw Error(j.error||"Código inválido.");const q=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(q.error)throw q.error;await boot()}catch(x){er.textContent=x.message||"Não foi possível entrar."}finally{S.busy=false;if(go){go.disabled=false;go.textContent="Entrar no LunaChat"}}}
async function boot(){cleanup();const{data:{session}}=await sb.auth.getSession();if(!session)return login();const m=await sb.from("participants").select("id,display_name,auth_user_id").eq("auth_user_id",session.user.id).maybeSingle();if(m.error||!m.data){await sb.auth.signOut();return login("Sessão inválida.")}S.me=m.data;const r=await sb.from("rooms").select("id,name,kind").order("created_at");S.rooms=r.data||[];shell()}
function shell(){app.innerHTML=`<div class="app" id="chatapp"><aside><div class="sideHead"><div class="mini"><b>☾</b>LunaChat</div><div class="sideActions"><button class="icon installBtn" id="install" hidden title="Instalar LunaChat">⬇</button><button class="icon" id="out" title="Sair">↪</button></div></div><div class="profile"><div class="avatar">${esc(initials(S.me.display_name))}</div><div><strong>${esc(S.me.display_name)}</strong><small>● conectado</small></div><button class="icon" id="rename">✎</button></div><div class="section">Conversas</div><div class="rooms" id="rooms"></div><div class="foot">🔒 Privado · 8 pessoas</div></aside><section class="pane" id="pane"><div class="welcome"><div><div style="font-size:55px">☾</div><h2>Bem-vindo ao LunaChat</h2><p>Escolha uma conversa.</p></div></div></section></div>`;$("#out").onclick=logout;$("#rename").onclick=rename;const ib=$("#install");if(ib)ib.onclick=installApp;refreshInstallButton();renderRooms()}
function renderRooms(){const el=$("#rooms");el.innerHTML=S.rooms.map(r=>`<button class="room ${S.room?.id===r.id?"active":""}" data-id="${r.id}"><div class="roomI">${r.kind==="group"?"👥":"🌙"}</div><div><span>${esc(r.name)}</span><small>Toque para abrir</small></div></button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>openRoom(b.dataset.id))}
async function openRoom(id){cleanup();S.room=S.rooms.find(x=>x.id===id);if(!S.room)return;S.messages=[];S.members=[];S.reads=[];S.presence=[];$("#chatapp").classList.add("open");renderRooms();renderChat();const[a,b,c,d]=await Promise.all([sb.from("messages").select("id,room_id,sender_id,body,message_type,media_path,edited_at,deleted_at,created_at,sender:participants!messages_sender_id_fkey(display_name)").eq("room_id",id).order("created_at",{ascending:false}).limit(120),sb.from("room_members").select("participant_id,participant:participants(display_name)").eq("room_id",id),sb.from("room_reads").select("participant_id,last_read_at").eq("room_id",id),sb.from("room_presence").select("participant_id,last_seen_at,typing_until").eq("room_id",id)]);if(S.room?.id!==id)return;S.messages=(a.data||[]).reverse();S.members=b.data||[];S.reads=c.data||[];S.presence=d.data||[];renderChat();await readNow();subscribe();heartbeat();toBottom($("#msgs"))}
function renderChat(){if(!S.room)return;const names=S.members.map(x=>x.participant?.display_name).filter(Boolean).join(", ");$("#pane").innerHTML=`<header class="chatHead"><button class="icon back" id="back">‹</button><div class="roomI">${S.room.kind==="group"?"👥":"🌙"}</div><div class="title"><strong>${esc(S.room.name)}</strong><small>${esc(names||"Conversa protegida")}</small></div>🔒</header><div class="msgs" id="msgs">${messagesHTML()}</div><div class="composer"><div id="pending"></div><div class="compose"><div class="box"><button class="icon" id="photo" title="Enviar foto ou vídeo">📎</button><input class="file" id="file" type="file" accept="image/*,video/*"><textarea id="text" rows="1" maxlength="4000" placeholder="Mensagem"></textarea><button class="icon" id="mic">🎙</button></div><button class="send" id="send">➤</button></div></div>`;$("#back").onclick=()=>$("#chatapp").classList.remove("open");$("#photo").onclick=()=>$("#file").click();$("#file").onchange=filePick;$("#send").onclick=send;$("#mic").onclick=record;$("#text").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#text").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px";typing()};bindActs();hydrate(true);renderPending()}
function messagesHTML(){if(!S.messages.length)return`<div class="welcome" style="height:auto;padding-top:70px"><div><h2>A conversa começa aqui</h2><p>Envie a primeira mensagem.</p></div></div>`;return S.messages.map(m=>{const mine=m.sender_id===S.me.id,name=m.sender?.display_name||"Participante";let body=m.deleted_at?'<div class="deleted">Mensagem apagada</div>':m.message_type==="image"?`<div data-media="${m.id}">Carregando imagem…</div>`:m.message_type==="video"?`<div data-media="${m.id}">Carregando vídeo…</div>`:m.message_type==="audio"?`<div data-media="${m.id}">Carregando áudio…</div>`:`<div class="text">${esc(m.body||"")}</div>`;const acts=mine&&!m.deleted_at?`<div class="actions">${m.message_type==="text"?`<button data-edit="${m.id}">✎</button>`:""}<button data-del="${m.id}">🗑</button></div>`:"";return`<div class="row ${mine?"mine":""}" data-msg="${m.id}">${!mine?`<div class="avatar" style="width:28px;height:28px;border-radius:9px;font-size:10px">${esc(initials(name))}</div>`:""}<div class="bubble">${!mine?`<div class="sender">${esc(name)}</div>`:""}${body}<div class="meta">${time(m.created_at)}${m.edited_at&&!m.deleted_at?" · editada":""}</div></div>${acts}</div>`}).join("")}
function bindActs(){$$("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));$$("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del))}
function $$(s){return[...document.querySelectorAll(s)]}
async function edit(id){const m=S.messages.find(x=>x.id===id);if(!m)return;modal("Editar mensagem",m.body||"",async v=>{v=v.trim();if(!v)return false;const r=await sb.from("messages").update({body:v,edited_at:new Date().toISOString()}).eq("id",id);if(r.error){toast("Não foi possível editar.");return false}return true})}
async function del(id){if(!confirm("Apagar esta mensagem para todos?"))return;const m=S.messages.find(x=>x.id===id);if(m?.media_path)await sb.storage.from(BUCKET).remove([m.media_path]);const r=await sb.from("messages").update({body:null,deleted_at:new Date().toISOString(),edited_at:null}).eq("id",id);if(r.error)toast("Não foi possível apagar.")}
async function send(){const box=$("#text"),t=box?.value.trim();if(!t&&!S.pending)return;$("#send").disabled=true;try{if(S.pending)await upload();if(t){const r=await sb.from("messages").insert({room_id:S.room.id,sender_id:S.me.id,body:t,message_type:"text"});if(r.error)throw r.error}if(box){box.value="";box.style.height="46px";box.focus({preventScroll:true})}toBottom($("#msgs"),true)}catch(e){console.error(e);toast("Não foi possível enviar.")}finally{if($("#send"))$("#send").disabled=false}}
function filePick(e){
    const f=e.target.files?.[0];
    if(!f)return;
    const isImage=f.type.startsWith("image/");
    const isVideo=f.type.startsWith("video/");
    if(!isImage&&!isVideo){e.target.value="";return toast("Escolha uma foto ou vídeo.");}
    if(f.size>100*1024*1024){e.target.value="";return toast("Máximo: 100 MB por arquivo.");}

function renderPending(){const p=$("#pending");if(!p)return;if(!S.pending){p.innerHTML="";return}p.innerHTML=`<div class="pending">${S.pending.type==="audio"?"🎙":S.pending.type==="video"?"🎬":"🖼"} <span>${esc(S.pending.name)}</span><button class="icon" id="cancelP">×</button></div>`;$("#cancelP").onclick=()=>{S.pending=null;renderPending()}}
async function upload(){const p=S.pending,ext=(p.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").slice(0,8),path=`${S.room.id}/${S.me.id}/${crypto.randomUUID()}.${ext}`;const u=await sb.storage.from(BUCKET).upload(path,p.blob,{contentType:p.mime});if(u.error)throw u.error;const r=await sb.from("messages").insert({room_id:S.room.id,sender_id:S.me.id,message_type:p.type,media_path:path,media_mime:p.mime,media_size:p.blob.size,duration_ms:p.duration});if(r.error){await sb.storage.from(BUCKET).remove([path]);throw r.error}S.pending=null;renderPending()}
async function record(){if(S.rec?.state==="recording"){S.rec.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Seu navegador não suporta gravação.");try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),types=["audio/webm;codecs=opus","audio/webm","audio/mp4"],mt=types.find(x=>MediaRecorder.isTypeSupported(x)),rec=new MediaRecorder(st,mt?{mimeType:mt}:undefined),chunks=[],start=Date.now();S.stream=st;S.rec=rec;$("#mic").classList.add("recording");rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const mime=rec.mimeType||"audio/webm",ext=mime.includes("mp4")?"m4a":"webm";S.pending={blob:new Blob(chunks,{type:mime}),type:"audio",mime,name:"audio."+ext,duration:Date.now()-start};st.getTracks().forEach(x=>x.stop());S.rec=null;S.stream=null;$("#mic")?.classList.remove("recording");renderPending()};rec.start(250)}catch{toast("Permissão do microfone foi negada.")}}
async function hydrate(keepBottom=false){for(const m of S.messages.filter(x=>x.media_path&&!x.deleted_at)){const el=document.querySelector(`[data-media="${m.id}"]`);if(!el)continue;const r=await sb.storage.from(BUCKET).createSignedUrl(m.media_path,3600);if(r.error||!r.data?.signedUrl){el.textContent="Mídia indisponível";continue}if(m.message_type==="image"){

  }else if(m.message_type==="video"){

function subscribe(){const id=S.room.id,ch=sb.channel("lc-"+id).on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"room_id=eq."+id},async payload=>{if(S.room?.id!==id)return;const old=$("#msgs"),keepBottom=payload?.new?.sender_id===S.me.id||nearBottom(old),oldTop=old?.scrollTop||0;const r=await sb.from("messages").select("id,room_id,sender_id,body,message_type,media_path,edited_at,deleted_at,created_at,sender:participants!messages_sender_id_fkey(display_name)").eq("room_id",id).order("created_at",{ascending:false}).limit(120);S.messages=(r.data||[]).reverse();const el=$("#msgs");if(el){el.innerHTML=messagesHTML();bindActs();hydrate(keepBottom);if(keepBottom)toBottom(el);else el.scrollTop=oldTop}readNow()}).subscribe();S.ch.push(ch)}
